# thirdparty-mock's CI (ADR 0009; pkhamdee/eshop-infra's docs/git-workflow.md, "Service repositories").
#   - pull request to main or release/*  -> lint and type-check (test equipment: no tests of its own), then the shared gates' SAST and dependency scan
#   - push to main                       -> also the image: built, run in the temporary copy beside the other
#                                           services' newest main images, gated, scanned, then pushed as
#                                           docker.io/pkhamdee/thirdparty-mock:main-<sha>-<ts> (Flux deploys it),
#                                           and signed keyless with this run's identity (the `image` job's
#                                           id-token: write; pkhamdee/eshop-infra's ADR 0011)
#   - push to release/N.x                -> the same, pushed as release-N.x-<sha> (a patch's image)
#   - workflow_dispatch on main or release/N.x -> rebuilds and pushes that branch's image the same way
# The gates are pkhamdee/eshop-infra's .github/workflows/service-image.yml. The jobs a pull request runs are main's
# required checks, by name: renaming one means re-running pkhamdee/eshop-infra's scripts/protect-main.sh.
name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: thirdparty-mock (lint, type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck

  image:
    name: image
    needs: [lint]
    # id-token: the shared gates sign each image they push, keyless, with this run's GitHub OIDC identity
    # (pkhamdee/eshop-infra#127). A called workflow gets no permission its caller doesn't grant.
    permissions:
      contents: read
      id-token: write
    uses: pkhamdee/eshop-infra/.github/workflows/service-image.yml@main
    with:
      images: '[{"service": "thirdparty-mock", "context": ".", "dockerfile": "Dockerfile"}]'
    # The shared gates' push job reads DOCKERHUB_USERNAME and DOCKERHUB_TOKEN from this repository's `publish`
    # environment, which a called workflow sees only with `secrets: inherit` (accepted in sast-accepted.txt).
    secrets: inherit
